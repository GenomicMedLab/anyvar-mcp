[project]
site_name = "AnyVar MCP Server"
site_description = "MCP server for AnyVar."
site_url = "https://genomicmedlab.github.io/anyvar-mcp/"
repo_url = "https://github.com/GenomicMedLab/anyvar-mcp"
repo_name = "GenomicMedLab/anyvar-mcp"
edit_uri = "edit/main/docs/"
dev_addr = "127.0.0.1:8001"
nav = [
  { "Home" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Dependencies" = "dependencies.md" },
  { "Configuration" = "configuration.md" },
  { "Connect your AI agent" = "connect.md" },
  { "Contributing" = "contributing.md" },
]

[project.extra.version]
provider = "mike"
default = "latest"
alias = true

[project.theme]
features = ["content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

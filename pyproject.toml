[project]
name = "anyvar-mcp"
authors = [{ name = "Wagner Lab" }]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
description = "MCP Server for AnyVar"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastmcp>=4,<5",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "requests>=2,<3",
]
dynamic = ["version"]

[project.optional-dependencies]
tests = ["pytest", "pytest-cov"]
dev = ["prek>=0.2.23", "ruff==0.14.10"]
docs = ["zensical==0.0.69"]

[project.urls]
Homepage = "https://github.com/genomicmedlab/anyvar-mcp"
Documentation = "https://genomicmedlab.github.io/anyvar-mcp/"
Changelog = "https://github.com/genomicmedlab/anyvar-mcp/releases"
Source = "https://github.com/genomicmedlab/anyvar-mcp"
"Bug Tracker" = "https://github.com/genomicmedlab/anyvar-mcp/issues"

[project.scripts]
anyvar-mcp = "anyvar_mcp.server:main"

[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report term-missing"
testpaths = ["tests"]
markers = ["live: tests requiring a running AnyVar service or external resources"]

[tool.coverage.run]
branch = true

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # unused
  "AIR",
  "ERA",
  "YTT",
  "BLE",
  "FBT",
  "CPY",
  "DJ",
  "EXE",
  "FIX",
  "FA",
  "PYI",
  "TD",
  "C90",
  "NPY",
  "PD",
  # ignore for compatibility with formatter
  "D206",
  "D300",
  "W191",
  "E111",
  "E114",
  "E117",
  "E501",
  "W191",
  "S321",
  "COM812",
  "COM819",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  # don't require types on *args, **kwargs
  "ANN002",
  "ANN003",
  # subjective pylint thresholds
  "PLR0904",
  "PLR091",
  "PLR1702",
  "PLC0206",
  # misc unnecessary stuff
  "S321",
  "D203",
  "D205",
  "D213",
  "D400",
  "D415",
]

[tool.ruff.lint.per-file-ignores]
# ANN001 - missing-type-function-argument
# ANN2 - missing-return-type
# D100 - undocumented-public-module
# D102 - undocumented-public-class
# D103 - undocumented-public-function
# S101 - assert
# B011 - assert-false
# INP001 - implicit-namespace-package
# PLR2004 - magic-value-comparison
"tests/*" = ["ANN001", "ANN2", "D", "S101", "B011", "INP001", "PLR2004"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
docstring-code-format = true
